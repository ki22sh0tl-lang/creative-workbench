<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="用批次连接灵感、选题、制作、发布数据和内容复盘的创意工作台。">
  <title>创意中台 | Content Experiment Workbench</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/spatial.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <aside>
    <a class="brand" href="#dashboard"><span class="mark">创</span><span>创意中台<small>Creative Workbench</small></span></a>

    <nav id="nav" aria-label="功能导航"></nav>
    <footer><span class="dot" aria-hidden="true"></span>内容工作空间<small>人工策划 · 数据驱动迭代</small></footer>
  </aside>
  <main>
    <header class="app-header">
      <a class="spatial-brand" href="#dashboard" aria-label="创意中台工作空间"><span class="brand-glyph" aria-hidden="true">◈</span><span class="brand-word">创意中台<small>Creative constellation</small></span></a>
      <nav class="top-navigation" aria-label="工作空间导航"><button type="button" data-space-nav="home" class="active">工作空间</button><button type="button" data-space-nav="works">发布作品</button><button type="button" data-space-nav="production">内容生产</button><button type="button" data-space-nav="review">复盘决策</button></nav>
      <div class="header-actions"><button type="button" id="view-toggle">列表视图</button><details class="manage-menu"><summary>管理</summary><div class="manage-options"><a href="#batches">实验批次</a><a href="#projects">项目管理</a><a href="#tags">标签字典</a><a href="#configs">账号与发布设置</a><a href="#relations">发布计划</a><a href="#analytics">数据分析 / 导出</a><a href="#notes">AI 批次复盘</a></div></details><button type="button" class="create-button" id="quick-create">＋ 新建选题</button></div>
      <span id="breadcrumb" hidden></span>
    </header>
    <div class="workspace-context"><label>项目 <select id="project" aria-label="切换项目"></select></label><span class="context-divider">/</span><label>实验批次 <select id="batch" aria-label="切换实验批次"></select></label><span class="context-note"><i></i>灵感、作品与决策，在这里相连</span></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="demo-banner" role="note"></div>
    <section id="content" tabindex="-1" aria-busy="true"><p>正在连接工作空间…</p></section>
  </main>
  <dialog id="editor" aria-labelledby="dialog-title"><form id="form"><div class="dialog-top"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="关闭编辑窗口">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit" id="save">保存</button></div></form></dialog>
  <dialog id="ai-dialog" aria-labelledby="ai-dialog-title"><form id="ai-form"><div class="dialog-top"><div><span class="eyebrow" id="ai-provider-label"></span><h2 id="ai-dialog-title">AI 营销与运营分析</h2></div><button type="button" id="ai-close" aria-label="关闭分析窗口">×</button></div><p class="muted">API Key 只在本次请求中使用，不写入数据库。提示词固定包含当前筛选后的 BI 数据。</p><label class="field">API Key<input id="ai-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" required></label><label class="field">固定分析提示词<textarea id="ai-prompt" name="prompt" rows="12" readonly></textarea></label><p id="ai-error" role="alert"></p><div id="ai-result" class="ai-result" aria-live="polite"></div><div class="dialog-actions"><button type="button" id="ai-copy">复制提示词</button><button class="primary" type="submit" id="ai-run">开始分析</button></div></form></dialog>
</body>
</html>
